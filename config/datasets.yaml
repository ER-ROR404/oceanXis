# --- Dataset configuration (config/datasets.yaml) ---
# Source of truth: docs/04-data/data-sources.md + dataset-registry.md.
#
# IMPORTANT (RULE 7): Dataset IDs MUST be verified via copernicusmarine.describe() before use.
# VERIFIED on 2026-09-02 via describe() + subset(dry_run=True) for Bay of Bengal & Arabian Sea.
# Evidence: docs/work-log/2026-09-02-copernicus-validation.md.

# Manifests directory (runtime), see .env.example DATASET_MANIFEST.
manifests_dir: "data/manifests/"
manifests_file: "datasets.json"
schema: "contracts/data/dataset-metadata.schema.json"

# Split policy (temporal, RULE 10 — no random shuffle of ocean data):
#   train 2018-01-01..2023-12-31 | validation 2024-01-01..2024-12-31 | test 2025-01-01..2025-12-31
# SSS uses MY for train/val and switches to NRT for test (MY ends ~2024; NRT starts 2024-01).
# Verified full-matrix coverage (all 7 inputs + GLORYS) across all windows: see work-log §5.
entries:
  SST:
    role: input
    selected_dataset_id: "METOFFICE-GLO-SST-L4-REP-OBS-SST"
    selected_variable: "analysed_sst"
    candidates:
      - { dataset_id: "METOFFICE-GLO-SST-L4-REP-OBS-SST", source: copernicus_marine, note: "multi-year reprocessed OSTIA; train/val/test" }
      - { dataset_id: "METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2", source: copernicus_marine, note: "NRT for live/production" }
    verified: true
    verified_at: "2026-09-02"

  SSS:
    role: input
    selected_dataset_id: "cmems_obs-mob_glo_phy-sss_my_multi_P1D"
    selected_variable: "sos"
    candidates:
      - { dataset_id: "cmems_obs-mob_glo_phy-sss_my_multi_P1D", source: copernicus_marine, note: "MY for train/val (→2024)" }
      - { dataset_id: "cmems_obs-mob_glo_phy-sss_nrt_multi_P1D", source: copernicus_marine, note: "NRT for test(2025) + production (2024→)" }
    verified: true
    verified_at: "2026-09-02"

  SSH:
    role: input
    selected_dataset_id: "cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D"
    selected_variable: "sla"
    candidates:
      - { dataset_id: "cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D", source: copernicus_marine, note: "MY altimetry L4; train/val/test" }
      - { dataset_id: "cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D", source: copernicus_marine, note: "NRT for live/production" }
    verified: true
    verified_at: "2026-09-02"

  current:
    role: input
    selected_dataset_id: "cmems_obs-mob_glo_phy-cur_my_0.25deg_P1D-m"
    selected_variable: "uo, vo"
    candidates:
      - { dataset_id: "cmems_obs-mob_glo_phy-cur_my_0.25deg_P1D-m", source: copernicus_marine, note: "MY observation currents uo/vo (total, geostrophic+Ekman+tide); train/val/test — DISCLOSE components, not 'pure satellite'" }
      - { dataset_id: "cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m", source: copernicus_marine, note: "model analysis uo/vo; NRT production (2022→)" }
    verified: true
    verified_at: "2026-09-02"

  wind:
    role: input
    selected_dataset_id: "cmems_obs-wind_glo_phy_my_l4_0.125deg_PT1H"
    selected_variable: "eastward_wind, northward_wind"
    candidates:
      - { dataset_id: "cmems_obs-wind_glo_phy_my_l4_0.125deg_PT1H", source: copernicus_marine, note: "MY L4 gridded scatterometer+model (2007→2026); train/val/test" }
      - { dataset_id: "cmems_obs-wind_glo_phy_nrt_l4_0.125deg_PT1H", source: copernicus_marine, note: "NRT L4 for live/production (2024-06→)" }
    verified: true
    verified_at: "2026-09-02"

  glorys_temperature:
    role: training_target
    selected_dataset_id: "cmems_mod_glo_phy_my_0.083deg_P1D-m"
    selected_variable: "thetao"
    candidates:
      - { dataset_id: "cmems_mod_glo_phy_my_0.083deg_P1D-m", source: glorys, note: "GLORYS12 daily physics reanalysis; thetao 0.49–5728 m; 1993→2026-06; NOT NRT (~1–2 mo latency)" }
    verified: true
    verified_at: "2026-09-02"

  argo:
    role: validation
    selected_dataset_id: null  # raw ARGO GDAC profiles preferred; see notes
    selected_variable: "TEMP (profiles)"
    candidates:
      - { dataset_id: "argo_profiles", source: argo, note: "independent validation only (RULE 9); matched by date/location from raw ARGO GDAC" }
      - { dataset_id: "cmems_obs-ins_glo_phy-temp-sal_my_cora-oa_P1M", source: copernicus_marine, note: "CORA-OA gridded TEMP fallback (subset-supported), ARGO+other in-situ — NOT purely single-float ARGO" }
    verified: false
    verified_at: null
