name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install shared tooling
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend ml data-engineering scripts
      - name: Ruff format check
        run: ruff format --check backend ml data-engineering scripts

  tests:
    name: Repository test gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e .
          pip install -e backend
          pip install -e ml
          pip install -e data-engineering
      - name: Run test gate
        run: make test

  contracts:
    name: Contract verification
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify contracts
        run: |
          pip install jsonschema PyYAML
          python scripts/verify-contracts.py