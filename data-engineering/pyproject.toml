[project]
name = "oceanembed-data"
version = "0.1.0"
description = "OceanEmbed data acquisition and harmonization (data-engineering)."
readme = "README.md"
requires-python = ">=3.11"

# Data-engineering environment (AGENTS.md environment isolation).
# Ingestion, harmonization, provenance tooling. Does NOT train models.

dependencies = [
    "copernicus-marine>=1.2",
    "xarray>=2024.1",
    "numpy>=1.26",
    "netcdf4>=1.6",
    "zarr>=2.17",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "dask[array]>=2024.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oceanembed_data*"]