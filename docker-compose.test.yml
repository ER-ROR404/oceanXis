# OceanEmbed — isolated integration-test infrastructure.
# Intended for CI (data-contract-tests, integration tests) without touching dev data.

services:
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=oceanembed_test
      - POSTGRES_PASSWORD=oceanembed_test
      - POSTGRES_DB=oceanembed_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanembed_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  contract-test:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../contracts:/workspace/contracts
      - ../config:/workspace/config
      - ../scripts:/workspace/scripts
      - ../tests:/workspace/tests
    command: >
      sh -c "pip install -q jsonschema PyYAML && python scripts/verify-contracts.py && pytest tests/fixtures -q"