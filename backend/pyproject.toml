[project]
name = "oceanembed-backend"
version = "0.1.0"
description = "OceanEmbed application backend (FastAPI) — orchestration layer, not ML training."
readme = "README.md"
requires-python = ">=3.11"

# Backend environment (AGENTS.md environment isolation).
# FastAPI + Pydantic + SQLAlchemy + copernicusmarine + xarray + inference runtime.
# MUST NOT include the PyTorch training stack (RULE 3, dependency isolation).

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "copernicus-marine>=1.2",
    "xarray>=2024.1",
    "numpy>=1.26",
    "netcdf4>=1.6",
    "zarr>=2.17",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]