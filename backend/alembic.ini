# Alembic configuration for OceanEmbed backend.
# Database URL is read from OCEANEMBED_DATABASE_URL env (see alembic/env.py).
# RULE 15: applied migrations are immutable — new schema changes = new files.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is injected at runtime from the environment; never hardcode.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S